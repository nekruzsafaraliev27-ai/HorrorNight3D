name: Build HorrorNight3D APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: firebelley/godot-export@v6
        with:
          godot_version: 4.3.0
          export_type: export_debug
          project_path: .
          preset: Android
          export_path: build/HorrorNight3D.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HorrorNight3D-APK
          path: build/HorrorNight3D.apk
